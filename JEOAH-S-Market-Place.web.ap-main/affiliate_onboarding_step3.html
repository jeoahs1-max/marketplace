<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finaliser ma vitrine - JEOAH'S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/firebase-config.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-xl items-center px-5 py-10">
        <section class="w-full rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <p class="text-sm font-bold uppercase tracking-wide text-indigo-700">Étape 3 sur 3</p>
            <h1 class="mt-2 text-3xl font-extrabold">Finalisez votre vitrine affiliée</h1>
            <p class="mt-3 text-sm leading-6 text-slate-600">Vos liens partenaires et vos réseaux sont enregistrés. Votre vitrine restera accessible à chaque prochaine connexion.</p>
            <label class="mt-6 block text-sm font-bold text-slate-700">Nom de votre vitrine
                <input id="store-name" required maxlength="80" class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 font-normal focus:border-indigo-600 focus:outline-none" placeholder="Ex. : Les trouvailles de Marie">
            </label>
            <p id="status" class="hidden mt-5 rounded-md px-3 py-2 text-sm" role="status"></p>
            <div class="mt-6 flex justify-end gap-3">
                <a href="/affiliate_onboarding_step2.html" class="rounded-md border border-slate-300 px-4 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50">Retour</a>
                <button id="complete-button" type="button" class="rounded-md bg-indigo-700 px-4 py-2.5 text-sm font-bold text-white hover:bg-indigo-800">Ouvrir ma vitrine</button>
            </div>
        </section>
    </main>
    <script type="module">
        import { getApps, initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { doc, getFirestore, serverTimestamp, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const button = document.getElementById('complete-button');
        const nameInput = document.getElementById('store-name');
        const status = document.getElementById('status');
        let currentUser;
        let db;

        function setStatus(message, error = false) {
            status.textContent = message;
            status.className = `mt-5 rounded-md px-3 py-2 text-sm ${error ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}`;
        }

        try {
            const config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : null;
            if (!config || !config.apiKey) throw new Error('Firebase non configuré');
            const app = getApps()[0] || initializeApp(config);
            db = getFirestore(app);
            onAuthStateChanged(getAuth(app), user => {
                currentUser = user;
                if (!user) location.href = '/public/auth.html';
            });
        } catch (error) {
            setStatus('La connexion est temporairement indisponible.', true);
            button.disabled = true;
        }

        button.addEventListener('click', async () => {
            const storeName = nameInput.value.trim();
            if (!storeName) {
                setStatus('Indiquez le nom de votre vitrine.', true);
                return;
            }
            if (!currentUser) {
                setStatus('Votre session a expiré. Connectez-vous de nouveau.', true);
                return;
            }
            button.disabled = true;
            setStatus('Enregistrement de votre vitrine...');
            try {
                await setDoc(doc(db, 'profiles', currentUser.uid), { role: 'affilie', storeName, onboardingComplete: true, updatedAt: serverTimestamp() }, { merge: true });
                const account = JSON.parse(localStorage.getItem('jeoahs_auth_user') || '{}');
                localStorage.setItem('jeoahs_auth_user', JSON.stringify({ ...account, uid: currentUser.uid, email: currentUser.email || '', role: 'affilie', roles: ['affilie'], onboardingComplete: true }));
                localStorage.setItem('jeoahs_affiliate_enabled', 'true');
                localStorage.setItem('jeoahs_affiliate_profile', JSON.stringify({ storeName }));
                location.href = '/affiliate-storefront.html';
            } catch (error) {
                setStatus('Impossible d’enregistrer la vitrine. Réessayez dans un instant.', true);
                button.disabled = false;
            }
        });
    </script>
    <script src="/public/jeoah-loader.js" defer></script>
</body>
</html>
