<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier - JEOAH'S</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white shadow-md sticky top-0 z-10">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0">
                    <a href="index.html" class="flex items-center text-2xl font-bold text-indigo-600"><img
                            src="public/assets/logo.png" alt="JEOAH'S Market Place"
                            class="w-12 h-12 object-cover rounded-lg mr-3">JEOAH'S Marketplace</a>
                </div>
                <div id="main-nav" class="flex items-center">
                    <div id="role-links" class="flex space-x-4">
                    </div>
                    <span class="border-r border-gray-300 h-6 mx-4"></span>
                    <div id="auth-links" class="flex items-center space-x-4">
                        <span class="text-gray-500 text-sm">Chargement...</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <main class="container mx-auto p-8">
        <h1 class="text-4xl font-bold text-gray-900 mb-6">Votre Panier</h1>
        <div id="notificationContainer"></div>

        <div class="lg:flex lg:space-x-8">
            <div id="cartItemsContainer" class="lg:w-2/3 space-y-4">
                <p class="text-gray-500 text-center py-10">Votre panier est vide ou en cours de chargement...</p>
            </div>

            <div class="lg:w-1/3 mt-8 lg:mt-0 bg-white p-6 rounded-xl shadow-lg h-fit">
                <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Résumé de la Commande</h2>

                <div id="cartSummary" class="space-y-2 text-gray-700">
                    <div class="flex justify-between"><span>Total Articles:</span> <span id="summarySubtotal">--</span>
                    </div>
                    <div class="flex justify-between"><span>Frais JEOAH'S (3%):</span> <span id="summaryFees">--</span>
                    </div>
                    <div class="pt-2 border-t font-bold text-lg flex justify-between">
                        <span>Total à Payer:</span> <span id="summaryTotal" class="text-indigo-600">--</span>
                    </div>
                </div>

                <p class="text-sm text-red-500 mt-4">Les frais JEOAH'S (3%) sont ajoutés à l'acheteur.</p>

                <button id="checkoutButton"
                    onclick="window.location.href='/payment.html?mode=cart'"
                    class="w-full mt-6 py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">
                    Passer la Commande (Paiement Sécurisé)
                </button>
            </div>
        </div>
    </main>

    <script src="/firebase-config.js"></script>
    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('jeoahs_cart') || '[]');
            const container = document.getElementById('cartItemsContainer');
            const btn = document.getElementById('checkoutButton');
            if (!cart.length) {
                container.innerHTML = `<div class="bg-white rounded-xl p-8 text-center shadow-sm border border-slate-200"><p class="text-slate-600 font-semibold">Votre panier est vide pour le moment.</p><a href="/showcase.html" class="mt-4 inline-block rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-bold text-white hover:bg-indigo-700">Explorer la Vitrine Centrale</a></div>`;
                document.getElementById('summarySubtotal').textContent = '$0.00';
                document.getElementById('summaryFees').textContent = '$0.00';
                document.getElementById('summaryTotal').textContent = '$0.00';
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            let subtotal = 0;
            container.innerHTML = cart.map((item, idx) => {
                const priceNum = Number(String(item.price || '0').replace(/[^0-9.]/g, '')) || 0;
                const qty = Number(item.quantity || 1);
                subtotal += priceNum * qty;
                return `<div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <img src="${item.imageUrl || 'https://placehold.co/100x100/e2e8f0/334155?text=Produit'}" class="w-16 h-16 rounded-lg object-cover">
                        <div>
                            <h3 class="font-bold text-slate-900">${item.name || 'Produit JEOAH\'S'}</h3>
                            <p class="text-xs text-slate-500">Vendeur : ${item.storeName || 'Boutique JEOAH\'S'}</p>
                            <p class="text-sm font-extrabold text-indigo-700 mt-1">$${priceNum.toFixed(2)} × ${qty}</p>
                        </div>
                    </div>
                    <button onclick="removeCartItem(${idx})" class="text-red-600 hover:bg-red-50 p-2 rounded-lg text-sm font-bold">Retirer</button>
                </div>`;
            }).join('');
            const fees = subtotal * 0.03;
            document.getElementById('summarySubtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('summaryFees').textContent = `$${fees.toFixed(2)}`;
            document.getElementById('summaryTotal').textContent = `$${(subtotal + fees).toFixed(2)}`;
        }
        window.removeCartItem = function (idx) {
            const cart = JSON.parse(localStorage.getItem('jeoahs_cart') || '[]');
            cart.splice(idx, 1);
            localStorage.setItem('jeoahs_cart', JSON.stringify(cart));
            renderCart();
        };
        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
    <script src="/public/jeoah-loader.js" defer></script>
</body>

</html>
