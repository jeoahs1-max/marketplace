<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis - JEOAH'S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/firebase-config.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-3xl px-5 py-12">
        <a href="/index.html" class="font-bold text-indigo-700">JEOAH'S Market Place</a>
        <h1 class="mt-6 text-4xl font-extrabold">Avis de notre communauté</h1>
        <p class="mt-3 text-slate-600">Acheteurs, vendeurs et affiliés testeurs : partagez votre expérience pour nous aider à améliorer JEOAH'S.</p>

        <form id="avis-form" class="mt-8 space-y-4 rounded-lg border border-slate-200 bg-white p-6">
            <label class="block text-sm font-bold">Votre nom<input id="avis-name" required class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal" placeholder="Ex. Marie"></label>
            <label class="block text-sm font-bold">Votre rôle
                <select id="avis-role" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal">
                    <option value="acheteur">Acheteur</option>
                    <option value="vendeur">Vendeur</option>
                    <option value="affilie">Affilié</option>
                    <option value="testeur">Testeur</option>
                </select>
            </label>
            <label class="block text-sm font-bold">Note
                <select id="avis-note" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal">
                    <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                    <option value="4">⭐⭐⭐⭐ Bien</option>
                    <option value="3">⭐⭐⭐ Correct</option>
                    <option value="2">⭐⭐ À améliorer</option>
                    <option value="1">⭐ Insuffisant</option>
                </select>
            </label>
            <label class="block text-sm font-bold">Votre avis<textarea id="avis-message" rows="4" required class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal" placeholder="Qu'avez-vous pensé de votre expérience ?"></textarea></label>
            <p id="avis-status" class="hidden rounded-lg px-4 py-3 text-sm font-semibold" role="status"></p>
            <button type="submit" class="w-full rounded-lg bg-indigo-700 px-5 py-3 font-bold text-white hover:bg-indigo-800">Envoyer mon avis</button>
        </form>

        <section id="avis-list" class="mt-10 space-y-4"><p class="text-sm text-slate-500">Chargement des avis...</p></section>

        <nav class="mt-10 flex items-center justify-between border-t border-slate-200 pt-6 text-sm font-semibold"><a href="/faq.html" class="text-indigo-700 hover:underline">← FAQ</a><a href="/about.html" class="text-indigo-700 hover:underline">À propos →</a></nav>
    </main>

    <script type="module">
        import { getApps, initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { addDoc, collection, getDocs, getFirestore, orderBy, query, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const form = document.getElementById('avis-form');
        const status = document.getElementById('avis-status');
        const list = document.getElementById('avis-list');
        const escape = value => String(value || '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
        let db, auth;

        function stars(note) { return '⭐'.repeat(Number(note) || 0); }

        async function loadAvis() {
            try {
                const snapshot = await getDocs(query(collection(db, 'avis'), orderBy('createdAt', 'desc')));
                const items = snapshot.docs.map(item => item.data());
                list.innerHTML = items.length ? items.map(avis => `<article class="rounded-lg border border-slate-200 bg-white p-5"><p class="font-bold">${escape(avis.name)} <span class="ml-2 text-xs font-semibold uppercase text-indigo-600">${escape(avis.role)}</span></p><p class="text-sm">${stars(avis.note)}</p><p class="mt-2 text-sm text-slate-600">${escape(avis.message)}</p></article>`).join('') : '<p class="text-sm text-slate-500">Aucun avis pour le moment. Soyez le premier !</p>';
            } catch (error) {
                list.innerHTML = '<p class="text-sm text-slate-500">Les avis seront disponibles dès que la connexion sécurisée est établie.</p>';
            }
        }

        try {
            const config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : null;
            if (config?.apiKey) {
                const app = getApps()[0] || initializeApp(config);
                db = getFirestore(app);
                auth = getAuth(app);
                onAuthStateChanged(auth, user => { if (!user) signInAnonymously(auth).catch(() => {}); });
            }
        } catch (error) { console.warn('Firebase init avis:', error.message); }

        loadAvis();

        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (!db) { status.textContent = 'Le service est temporairement indisponible.'; status.className = 'rounded-lg bg-red-50 px-4 py-3 text-sm font-semibold text-red-800'; return; }
            try {
                await addDoc(collection(db, 'avis'), {
                    name: document.getElementById('avis-name').value.trim(),
                    role: document.getElementById('avis-role').value,
                    note: Number(document.getElementById('avis-note').value),
                    message: document.getElementById('avis-message').value.trim(),
                    createdAt: serverTimestamp()
                });
                status.textContent = 'Merci pour votre avis !';
                status.className = 'rounded-lg bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-800';
                form.reset();
                loadAvis();
            } catch (error) {
                status.textContent = 'Impossible d\'envoyer votre avis pour le moment.';
                status.className = 'rounded-lg bg-red-50 px-4 py-3 text-sm font-semibold text-red-800';
            }
        });
    </script>
    <script src="/public/jeoah-loader.js" defer></script>
</body>
</html>
