<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un produit - JEOAH'S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/firebase-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-4xl px-4 py-8 sm:py-12">
        <a href="/affiliate-storefront.html" class="inline-flex items-center gap-2 text-sm font-bold text-purple-700 hover:text-purple-900"><i class="fas fa-arrow-left"></i> Retour à ma vitrine</a>
        <header class="mt-6">
            <p class="text-sm font-bold uppercase tracking-wide text-pink-600">Ma boutique</p>
            <h1 class="mt-2 text-3xl font-extrabold">Ajouter un produit</h1>
            <p class="mt-2 text-sm text-slate-600">Ajoutez jusqu'à trois photos et une vidéo facultative. Vous pourrez modifier ces informations depuis votre vitrine.</p>
        </header>

        <form id="product-form" class="mt-8 space-y-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
            <div class="grid gap-5 sm:grid-cols-2">
                <label class="block text-sm font-bold text-slate-700">Nom du produit
                    <input id="product-name" required maxlength="120" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal focus:border-purple-600 focus:outline-none" placeholder="Ex. : Huile de coco bio">
                </label>
                <label class="block text-sm font-bold text-slate-700">Catégorie
                    <input id="product-category" required maxlength="60" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal focus:border-purple-600 focus:outline-none" placeholder="Ex. : Beauté et soins">
                </label>
                <label class="block text-sm font-bold text-slate-700">Prix en USD
                    <input id="product-price" required type="number" min="0" step="0.01" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal focus:border-purple-600 focus:outline-none" placeholder="0.00">
                </label>
                <label class="block text-sm font-bold text-slate-700">Quantité en stock
                    <input id="product-stock" required type="number" min="0" step="1" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal focus:border-purple-600 focus:outline-none" placeholder="0">
                </label>
            </div>

            <label class="block text-sm font-bold text-slate-700">Description
                <textarea id="product-description" required maxlength="1000" rows="5" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal focus:border-purple-600 focus:outline-none" placeholder="Présentez les caractéristiques, l'état et les avantages du produit."></textarea>
            </label>

            <section>
                <h2 class="text-sm font-bold text-slate-700">Photos du produit</h2>
                <p class="mt-1 text-xs text-slate-500">La première photo est l'image principale. Ajoutez des liens d'images accessibles publiquement.</p>
                <div class="mt-3 grid gap-4 sm:grid-cols-3">
                    <label class="block text-sm font-semibold text-slate-700">Photo 1
                        <input id="product-image-1" required type="url" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal focus:border-purple-600 focus:outline-none" placeholder="https://...">
                    </label>
                    <label class="block text-sm font-semibold text-slate-700">Photo 2
                        <input id="product-image-2" type="url" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal focus:border-purple-600 focus:outline-none" placeholder="https://...">
                    </label>
                    <label class="block text-sm font-semibold text-slate-700">Photo 3
                        <input id="product-image-3" type="url" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal focus:border-purple-600 focus:outline-none" placeholder="https://...">
                    </label>
                </div>
            </section>

            <label class="block text-sm font-bold text-slate-700">Vidéo de présentation <span class="font-normal text-slate-500">(facultatif)</span>
                <input id="product-video" type="url" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 font-normal focus:border-purple-600 focus:outline-none" placeholder="https://...">
            </label>

            <p id="form-status" class="hidden rounded-lg px-4 py-3 text-sm font-semibold" role="status"></p>
            <div class="flex flex-wrap justify-end gap-3 border-t border-slate-100 pt-5">
                <a href="/affiliate-storefront.html" class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50">Annuler</a>
                <button type="submit" class="rounded-lg bg-purple-700 px-5 py-2.5 text-sm font-bold text-white hover:bg-purple-800"><i class="fas fa-check mr-2"></i>Publier le produit</button>
            </div>
        </form>
    </main>

    <script type="module">
        import { getApps, initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { doc, getFirestore, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const form = document.getElementById('product-form');
        const status = document.getElementById('form-status');
        let db;
        let currentUser;

        try {
            const config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : null;
            if (!config || !config.apiKey) throw new Error('Firebase non configuré');
            const app = getApps()[0] || initializeApp(config);
            db = getFirestore(app);
            onAuthStateChanged(getAuth(app), user => { currentUser = user; });
        } catch (error) {
            status.textContent = 'La publication est temporairement indisponible.';
            status.className = 'rounded-lg bg-red-50 px-4 py-3 text-sm font-semibold text-red-800';
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (!currentUser || !db) {
                status.textContent = 'Connectez-vous avec votre compte vendeur pour publier un produit.';
                status.className = 'rounded-lg bg-red-50 px-4 py-3 text-sm font-semibold text-red-800';
                return;
            }
            const images = ['product-image-1', 'product-image-2', 'product-image-3']
                .map(id => document.getElementById(id).value.trim())
                .filter(Boolean);
            const product = {
                id: `vendor-${Date.now()}`,
                name: document.getElementById('product-name').value.trim(),
                category: document.getElementById('product-category').value.trim(),
                price: Number(document.getElementById('product-price').value).toFixed(2),
                stock: Number(document.getElementById('product-stock').value),
                description: document.getElementById('product-description').value.trim(),
                imageUrl: images[0],
                images,
                videoUrl: document.getElementById('product-video').value.trim(),
                ownerId: currentUser.uid,
                createdAt: new Date().toISOString()
            };
            try {
                await setDoc(doc(db, 'products', product.id), product);
                const products = JSON.parse(localStorage.getItem('jeoahs_vendor_products') || '[]');
                products.push(product);
                localStorage.setItem('jeoahs_vendor_products', JSON.stringify(products));
                status.textContent = 'Produit publié sur votre vitrine.';
                status.className = 'rounded-lg bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-800';
                setTimeout(() => { window.location.href = '/affiliate-storefront.html'; }, 500);
            } catch (error) {
                status.textContent = 'Impossible de publier le produit. Vérifiez que votre compte est vendeur.';
                status.className = 'rounded-lg bg-red-50 px-4 py-3 text-sm font-semibold text-red-800';
            }
        });
    </script>
    <script src="/public/jeoah-loader.js" defer></script>
</body>
</html>
