<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendeur - Étape 2/3 : Réseaux Sociaux - JEOAH'S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'primary-blue': '#1D4ED8',
                        'accent-orange': '#F97316',
                        'gray-bg': '#F3F4F6',
                        'dark-text': '#1F2937',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl p-8 space-y-8">
        
        <header class="text-center">
            <p class="text-xs font-extrabold uppercase tracking-wider text-blue-700 mb-1">Étape 2 sur 3 — Parcours Vendeur</p>
            <h1 class="text-3xl font-extrabold text-dark-text">Votre Boutique : Réseaux Sociaux</h1>
            <p class="mt-2 text-sm text-gray-500">Ajoutez jusqu'à 5 liens sociaux pour vos promotions. Cela aide JEOAH IA à cibler vos clients. (Optionnel)</p>
            <div class="w-full bg-gray-200 rounded-full h-2.5 mt-4">
                <div class="bg-blue-600 h-2.5 rounded-full" style="width: 66%"></div>
            </div>
        </header>

        <form id="supplierSocialForm" class="space-y-6">
            
            <div class="p-4 bg-gray-50 rounded-lg text-center">
                <p class="text-xs font-semibold text-gray-600 mb-2">Exemples de plateformes :</p>
                <div class="flex flex-wrap justify-center gap-4 text-xl">
                    <i class="fab fa-instagram text-pink-600" title="Instagram"></i>
                    <i class="fab fa-tiktok text-black" title="TikTok"></i>
                    <i class="fab fa-youtube text-red-600" title="YouTube"></i>
                    <i class="fab fa-twitter text-blue-400" title="X/Twitter"></i>
                    <i class="fab fa-facebook text-blue-700" title="Facebook"></i>
                    <i class="fab fa-snapchat text-yellow-500" title="Snapchat"></i>
                    <i class="fab fa-linkedin text-blue-800" title="LinkedIn"></i>
                    <i class="fab fa-telegram text-blue-500" title="Telegram"></i>
                    <i class="fab fa-quora text-red-800" title="Quora"></i>
                    <i class="fab fa-reddit text-orange-600" title="Reddit"></i>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="social_link_1" class="block text-sm font-medium text-gray-700">Lien Social 1 (Principal de la Boutique)</label>
                    <input type="url" id="social_link_1" name="social_link_1" placeholder="https://instagram.com/votre_boutique..."
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-primary-blue focus:border-primary-blue transition">
                </div>
                <div>
                    <label for="social_link_2" class="block text-sm font-medium text-gray-700">Lien Social 2</label>
                    <input type="url" id="social_link_2" name="social_link_2" placeholder="https://"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-primary-blue focus:border-primary-blue transition">
                </div>
                <div>
                    <label for="social_link_3" class="block text-sm font-medium text-gray-700">Lien Social 3</label>
                    <input type="url" id="social_link_3" name="social_link_3" placeholder="https://"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-primary-blue focus:border-primary-blue transition">
                </div>
                <div>
                    <label for="social_link_4" class="block text-sm font-medium text-gray-700">Lien Social 4</label>
                    <input type="url" id="social_link_4" name="social_link_4" placeholder="https://"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-primary-blue focus:border-primary-blue transition">
                </div>
                <div>
                    <label for="social_link_5" class="block text-sm font-medium text-gray-700">Lien Social 5 (Max)</label>
                    <input type="url" id="social_link_5" name="social_link_5" placeholder="https://"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-primary-blue focus:border-primary-blue transition">
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 pt-4">
                <a href="vendor_onboarding.html"
                        class="flex justify-center items-center py-2.5 px-4 border border-gray-300 rounded-xl shadow-sm text-sm font-bold text-gray-700 bg-white hover:bg-gray-100 transition">
                    <i class="fas fa-arrow-left mr-2"></i> Précédent
                </a>
                <button type="button" id="skipButton"
                        class="flex-1 flex justify-center items-center py-2.5 px-4 border border-gray-300 rounded-xl shadow-sm text-sm font-bold text-gray-700 bg-white hover:bg-gray-100 transition">
                    Sauter cette étape
                </button>
                <button type="submit" id="nextButton"
                        class="flex-1 flex justify-center items-center py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-primary-blue hover:bg-blue-700 transition">
                    Continuer (Étape 3/3) <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
            
        </form>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('supplierSocialForm');
            const skipButton = document.getElementById('skipButton');
            const savedLinks = JSON.parse(localStorage.getItem('jeoahs_vendor_social_links') || '[]');
            savedLinks.forEach((url, idx) => {
                const input = document.getElementById('social_link_' + (idx + 1));
                if (input) input.value = url;
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const links = [1, 2, 3, 4, 5]
                    .map(i => document.getElementById('social_link_' + i)?.value.trim())
                    .filter(Boolean);
                localStorage.setItem('jeoahs_vendor_social_links', JSON.stringify(links));
                window.location.href = 'vendor_onboarding_step3.html';
            });

            skipButton.addEventListener('click', () => {
                window.location.href = 'vendor_onboarding_step3.html';
            });
        });
    </script>
    <script src="/public/jeoah-loader.js" defer></script>
</body>
</html>
