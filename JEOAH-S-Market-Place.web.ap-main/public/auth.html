<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - JEOAH'S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/firebase-config.js"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-md items-center px-5 py-10">
        <section class="w-full rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <a href="/index.html" class="text-sm font-bold text-indigo-700 hover:underline">JEOAH'S Market Place</a>
            <h1 id="form-title" class="mt-5 text-3xl font-extrabold">Connexion</h1>
            <p id="form-description" class="mt-2 text-sm text-slate-600">Retrouvez votre vitrine et votre espace
                personnel.</p>

            <div id="active-session-box" class="hidden mt-4 rounded-xl border border-indigo-200 bg-indigo-50/80 p-4 space-y-3 text-xs">
                <p id="active-session-text" class="font-bold text-indigo-950"></p>
                <div class="space-y-1.5">
                    <p class="text-[11px] font-extrabold uppercase tracking-wider text-indigo-800">1. Vérifier les Parcours d'Inscription (Onboarding) :</p>
                    <div class="grid grid-cols-1 gap-1.5">
                        <button type="button" onclick="startOnboardingFlow('vendeur')" class="rounded-lg bg-blue-600 px-3 py-2 font-extrabold text-white hover:bg-blue-700 transition text-left">
                            📝 Parcours Inscription Vendeur (Étapes 1 → 2 → 3)
                        </button>
                        <button type="button" onclick="startOnboardingFlow('affilie')" class="rounded-lg bg-fuchsia-700 px-3 py-2 font-extrabold text-white hover:bg-fuchsia-800 transition text-left">
                            📝 Parcours Inscription Affilié (Étapes 1 → 2 → 3)
                        </button>
                        <button type="button" onclick="startOnboardingFlow('acheteur')" class="rounded-lg bg-teal-600 px-3 py-2 font-extrabold text-white hover:bg-teal-700 transition text-left">
                            📝 Parcours Inscription Acheteur Membre (Profil Social)
                        </button>
                    </div>
                </div>
                <div class="space-y-1.5 pt-2 border-t border-indigo-200/60">
                    <p class="text-[11px] font-extrabold uppercase tracking-wider text-indigo-800">2. Accès direct aux Espaces &amp; Tableaux de Bord :</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <button type="button" onclick="enterRoleSpace('vendeur')" class="rounded-lg bg-emerald-600 px-3 py-2.5 font-extrabold text-white hover:bg-emerald-700 transition">
                            🏪 Espace Vendeur
                        </button>
                        <button type="button" onclick="enterRoleSpace('affilie')" class="rounded-lg bg-purple-700 px-3 py-2.5 font-extrabold text-white hover:bg-purple-800 transition">
                            🔗 Espace Affilié
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between pt-1 border-t border-indigo-200/60">
                    <a href="/affiliate-storefront.html" class="font-bold text-indigo-700 hover:underline">Voir ma Vitrine</a>
                    <button type="button" onclick="logoutCurrentSession()" class="font-bold text-red-600 hover:underline">Se déconnecter / Autre compte</button>
                </div>
            </div>

            <form id="auth-form" class="mt-6 space-y-5">
                <label class="block text-sm font-bold text-slate-700">Adresse e-mail
                    <input id="email" type="email" autocomplete="email" required
                        class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 font-normal focus:border-indigo-600 focus:outline-none">
                </label>
                <label class="block text-sm font-bold text-slate-700">Mot de passe
                    <input id="password" type="password" autocomplete="current-password" minlength="6" required
                        class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 font-normal focus:border-indigo-600 focus:outline-none">
                </label>
                <label id="password-confirm-field" class="hidden block text-sm font-bold text-slate-700">Confirmer le
                    mot de passe
                    <input id="password-confirm" type="password" autocomplete="new-password" minlength="6"
                        class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 font-normal focus:border-indigo-600 focus:outline-none">
                </label>
                <label id="role-field" class="block text-sm font-bold text-slate-700">Accéder à mon espace en tant que
                    <select id="role"
                        class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2.5 font-normal focus:border-indigo-600 focus:outline-none bg-white">
                        <option value="vendeur">Vendeur</option>
                        <option value="affilie">Affilié</option>
                        <option value="acheteur">Acheteur</option>
                    </select>
                </label>
                <p id="auth-status" class="hidden rounded-md px-3 py-2 text-sm" role="status"></p>
                <button id="submit-button" type="submit"
                    class="w-full rounded-md bg-indigo-700 px-4 py-3 text-sm font-bold text-white hover:bg-indigo-800">Se
                    connecter</button>
            </form>

            <div class="my-5 flex items-center gap-3 text-xs text-slate-400"><span
                    class="h-px flex-1 bg-slate-200"></span><span>ou</span><span
                    class="h-px flex-1 bg-slate-200"></span></div>
            <button id="google-button" type="button"
                class="w-full rounded-md border border-slate-300 bg-white px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50">Continuer
                avec Google</button>

            <button id="mode-button" type="button"
                class="mt-5 w-full text-sm font-bold text-indigo-700 hover:underline">Créer un compte</button>
        </section>
    </main>

    <script type="module">
        import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { browserLocalPersistence, createUserWithEmailAndPassword, getAuth, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, setPersistence, signInWithEmailAndPassword, signInWithPopup, signInWithRedirect } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { doc, getDoc, getFirestore, serverTimestamp, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const form = document.getElementById('auth-form');
        const modeButton = document.getElementById('mode-button');
        const roleField = document.getElementById('role-field');
        const title = document.getElementById('form-title');
        const description = document.getElementById('form-description');
        const submitButton = document.getElementById('submit-button');
        const googleButton = document.getElementById('google-button');
        const passwordConfirmField = document.getElementById('password-confirm-field');
        const status = document.getElementById('auth-status');
        const selectedPlan = new URLSearchParams(location.search).get('plan');
        const selectedPlanRole = new URLSearchParams(location.search).get('planRole');
        const referralCode = new URLSearchParams(location.search).get('ref');
        const testerEmails = new Set([
            'ff1986fredlin11@gmail.com', 'fleuricotamy@gmail.com',
            'stephaniejeancharles95@gmail.com', 'physiotherapeutejoseph@gmail.com',
            'vernetloveson509@gmail.com', 'jeanlouislynseykeren@gmail.com',
            'ramecey30@gmail.com', 'jeanlouisardyyy@gmail.com',
            'jjeanlouis96@gmail.com', 'emelinejulien744@gmail.com'
        ]);
        let isRegistration = false;
        let auth;
        let db;
        let submitting = false;

        function setStatus(message, type = 'error') {
            status.textContent = message;
            status.className = `rounded-md px-3 py-2 text-sm ${type === 'error' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}`;
        }

        function setMode(register) {
            isRegistration = register;
            title.textContent = register ? 'Créer un compte' : 'Connexion';
            description.textContent = register ? 'Configurez votre rôle et accédez immédiatement à votre espace.' : 'Choisissez l’espace à ouvrir (Vendeur ou Affilié) et connectez-vous.';
            roleField.classList.remove('hidden');
            passwordConfirmField.classList.toggle('hidden', !register);
            document.getElementById('password-confirm').required = register;
            submitButton.textContent = register ? 'Créer mon compte' : 'Se connecter';
            modeButton.textContent = register ? 'J’ai déjà un compte' : 'Créer un compte';
            document.getElementById('password').autocomplete = register ? 'new-password' : 'current-password';
            status.classList.add('hidden');
        }

        function syncRoleSubscriptionsToLocal(profile, isPrivileged) {
            const forever = '2099-12-31T23:59:59.000Z';
            if (isPrivileged) {
                const privSub = { plan: 'tester', status: 'active', active: true, expiresAt: forever };
                localStorage.setItem('jeoahs_vendor_subscription', JSON.stringify({ ...privSub, role: 'vendeur' }));
                localStorage.setItem('jeoahs_affiliate_subscription', JSON.stringify({ ...privSub, role: 'affilie' }));
                return { vendeur: { ...privSub, role: 'vendeur' }, affilie: { ...privSub, role: 'affilie' } };
            }
            const subs = profile?.subscriptions || {};
            const vSub = subs.vendeur || { plan: 'free', status: 'free', active: false, role: 'vendeur', expiresAt: null };
            const aSub = subs.affilie || { plan: 'free', status: 'free', active: false, role: 'affilie', expiresAt: null };
            localStorage.setItem('jeoahs_vendor_subscription', JSON.stringify(vSub));
            localStorage.setItem('jeoahs_affiliate_subscription', JSON.stringify(aSub));
            return { vendeur: vSub, affilie: aSub };
        }

        function destination(profile, isNewRegistration = false) {
            if (selectedPlan && selectedPlan !== 'free' && !profile.testAccount) {
                const targetRole = selectedPlanRole || (profile.role === 'vendeur' ? 'vendeur' : 'affilie');
                return `/payment.html?plan=${encodeURIComponent(selectedPlan)}&role=${encodeURIComponent(targetRole)}`;
            }
            if (profile.role === 'affilie') {
                return (isNewRegistration || !profile.onboardingComplete) ? '/affiliate_onboarding_step1.html' : '/affiliate-storefront.html';
            }
            if (profile.role === 'vendeur') {
                const hasVendorSetup = Boolean(localStorage.getItem('jeoahs_vendor_profile') || localStorage.getItem('jeoahs_vendor_store'));
                return (isNewRegistration || (!profile.onboardingComplete && !hasVendorSetup)) ? '/vendor_onboarding.html' : '/vendor_dashboard.html';
            }
            if (profile.role === 'acheteur') {
                const hasBuyerSocial = Boolean(localStorage.getItem('jeoahs_buyer_social_links'));
                return (isNewRegistration || (!profile.onboardingComplete && !hasBuyerSocial)) ? '/acheteur-social-setup.html' : '/showcase.html';
            }
            return '/showcase.html';
        }

        async function loadProfile(user) {
            if (!db || !user?.uid) return null;
            try {
                const profileSnapshot = await getDoc(doc(db, 'profiles', user.uid));
                if (profileSnapshot.exists()) return profileSnapshot.data();
            } catch (e) {
                console.warn('Lecture profil Firestore ignorée:', e?.code || e?.message);
            }
            try {
                const legacySnapshot = await getDoc(doc(db, 'artifacts/jeoahs1-max-03326376-49b27/public/data/users', user.uid));
                if (legacySnapshot.exists()) return legacySnapshot.data();
            } catch (e) {
                console.warn('Lecture profil legacy Firestore ignorée:', e?.code || e?.message);
            }
            return null;
        }

        function isInternalAdminAddr(emailStr) {
            try { return btoa(String(emailStr || '').trim().toLowerCase()) === 'amVvYWhzMUBnbWFpbC5jb20='; } catch (_) { return false; }
        }

        window.startOnboardingFlow = async function (targetRole) {
            const roleSelect = document.getElementById('role');
            if (roleSelect) roleSelect.value = targetRole;
            const account = JSON.parse(localStorage.getItem('jeoahs_auth_user') || '{}');
            account.role = targetRole;
            account.roles = Array.from(new Set([...(account.roles || []), targetRole]));
            localStorage.setItem('jeoahs_auth_user', JSON.stringify(account));
            localStorage.setItem('jeoahs_user', JSON.stringify(account));

            if (auth?.currentUser) {
                try { await continueToSpace(auth.currentUser, false, targetRole); } catch (_) {}
            }
            if (targetRole === 'vendeur') {
                location.href = '/vendor_onboarding.html';
            } else if (targetRole === 'affilie') {
                location.href = '/affiliate_onboarding_step1.html?retest=1';
            } else {
                location.href = '/acheteur-social-setup.html';
            }
        };

        window.enterRoleSpace = async function (targetRole) {
            const roleSelect = document.getElementById('role');
            if (roleSelect) roleSelect.value = targetRole;
            const account = JSON.parse(localStorage.getItem('jeoahs_auth_user') || '{}');
            account.role = targetRole;
            account.roles = Array.from(new Set([...(account.roles || []), targetRole]));
            localStorage.setItem('jeoahs_auth_user', JSON.stringify(account));
            localStorage.setItem('jeoahs_user', JSON.stringify(account));

            if (auth?.currentUser) {
                await continueToSpace(auth.currentUser, true, targetRole);
            } else {
                location.href = targetRole === 'affilie' ? '/affiliate-storefront.html' : '/vendor_dashboard.html';
            }
        };

        window.logoutCurrentSession = async function () {
            try { await auth?.signOut(); } catch (_) {}
            localStorage.removeItem('jeoahs_auth_user');
            localStorage.removeItem('jeoahs_user');
            document.getElementById('active-session-box')?.classList.add('hidden');
            setStatus('Session déconnectée. Vous pouvez vous connecter avec le compte de votre choix.', 'success');
        };

        async function continueToSpace(user, shouldRedirect = true, forcedRole = null) {
            let profile = await loadProfile(user);
            if (user.email && isInternalAdminAddr(user.email)) {
                const subs = syncRoleSubscriptionsToLocal({}, true);
                localStorage.setItem('jeoahs_auth_user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    role: 'admin',
                    roles: ['admin', 'vendeur', 'affilie'],
                    internalAdmin: true,
                    testAccount: true,
                    selectedPlan: 'enterprise',
                    subscriptions: subs,
                    onboardingComplete: true
                }));
                if (shouldRedirect) location.href = '/admin.html';
                return;
            }
            const chosenRole = forcedRole || document.getElementById('role')?.value || selectedPlanRole || profile?.role || 'vendeur';
            let normalizedRole = { seller: 'vendeur', vendor: 'vendeur', affiliate: 'affilie', buyer: 'acheteur' }[chosenRole] || chosenRole;
            const isTester = testerEmails.has((user.email || '').toLowerCase()) || Boolean(profile?.testAccount);

            if (forcedRole) {
                normalizedRole = forcedRole;
            } else if (chosenRole === 'affilie' || chosenRole === 'vendeur' || chosenRole === 'acheteur') {
                normalizedRole = chosenRole;
            }

            if (!profile) {
                profile = profileFor(user, normalizedRole);
                try { await setDoc(doc(db, 'profiles', user.uid), profile, { merge: true }); } catch (_) {}
            }

            const existingRoles = Array.isArray(profile?.roles) ? profile.roles : (profile?.role ? [profile.role] : []);
            const rolesList = Array.from(new Set([...existingRoles, normalizedRole, ...(isTester ? ['vendeur', 'affilie'] : [])]));
            profile = {
                ...profile,
                role: normalizedRole,
                roles: rolesList,
                ...(isTester ? { selectedPlan: 'tester', testAccount: true } : {})
            };

            try {
                await setDoc(doc(db, 'profiles', user.uid), {
                    role: profile.role,
                    roles: rolesList,
                    ...(isTester ? { selectedPlan: 'tester', testAccount: true } : {}),
                    updatedAt: serverTimestamp()
                }, { merge: true });
            } catch (_) {}

            const subs = syncRoleSubscriptionsToLocal(profile, isTester);
            const identity = await saveAccountIdentity(user, profile);
            const authUserObj = {
                uid: user.uid,
                email: user.email || '',
                role: profile.role,
                roles: rolesList,
                onboardingComplete: Boolean(profile.onboardingComplete),
                accountCode: identity.code,
                referralLink: identity.link,
                testAccount: isTester,
                selectedPlan: isTester ? 'tester' : (subs[profile.role]?.plan || 'free'),
                subscriptions: subs
            };
            localStorage.setItem('jeoahs_auth_user', JSON.stringify(authUserObj));
            localStorage.setItem('jeoahs_user', JSON.stringify(authUserObj));

            if (shouldRedirect) {
                location.href = destination(profile);
            } else {
                const box = document.getElementById('active-session-box');
                const txt = document.getElementById('active-session-text');
                if (box && txt) {
                    txt.textContent = `Connecté avec ${user.email} ${isTester ? '(Compte Testeur Actif)' : ''} — Choisissez le parcours à vérifier :`;
                    box.classList.remove('hidden');
                }
            }
        }

        function createAccountIdentity(user) {
            const code = `JEOAH-${user.uid.slice(0, 8).toUpperCase()}`;
            return { code, link: `${location.origin}/public/auth.html?ref=${encodeURIComponent(code)}` };
        }

        function profileFor(user, role = 'acheteur') {
            const identity = createAccountIdentity(user);
            const email = (user.email || '').toLowerCase();
            const isTester = testerEmails.has(email) || isInternalAdminAddr(email);
            const forever = '2099-12-31T23:59:59.000Z';
            const defaultSub = isTester
                ? { plan: 'tester', status: 'active', active: true, expiresAt: forever }
                : { plan: 'free', status: 'free', active: false, expiresAt: null };
            return {
                role,
                roles: [role],
                onboardingComplete: false,
                selectedPlan: isTester ? 'tester' : 'free',
                testAccount: isTester,
                subscriptions: {
                    vendeur: { ...defaultSub, role: 'vendeur' },
                    affilie: { ...defaultSub, role: 'affilie' }
                },
                accountCode: identity.code,
                referralLink: identity.link,
                referredByCode: referralCode || null,
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            };
        }

        async function saveAccountIdentity(user, profile) {
            const identity = profile.accountCode && profile.referralLink ? { code: profile.accountCode, link: profile.referralLink } : createAccountIdentity(user);
            if (!profile.accountCode || !profile.referralLink || (referralCode && !profile.referredByCode)) {
                try {
                    await setDoc(doc(db, 'profiles', user.uid), {
                        accountCode: identity.code,
                        referralLink: identity.link,
                        ...(referralCode && !profile.referredByCode ? { referredByCode: referralCode } : {}),
                        updatedAt: serverTimestamp()
                    }, { merge: true });
                } catch (e) {
                    console.warn('Sauvegarde identité Firestore ignorée:', e?.code || e?.message);
                }
            }
            return identity;
        }

        function messageFor(error) {
            const messages = {
                'auth/email-already-in-use': 'Cette adresse e-mail possède déjà un compte. Connectez-vous.',
                'auth/invalid-credential': 'Adresse e-mail ou mot de passe incorrect.',
                'auth/weak-password': 'Le mot de passe doit contenir au moins 6 caractères.',
                'auth/operation-not-allowed': 'La connexion par e-mail doit être activée dans Firebase Authentication.',
                'auth/popup-blocked': 'La fenêtre Google a été bloquée. Réessayez : une page Google va s’ouvrir.',
                'auth/popup-closed-by-user': 'La fenêtre Google a été fermée avant la connexion.',
                'auth/unauthorized-domain': 'Ce domaine n’est pas autorisé dans Firebase. Ajoutez www.jeoahs.com dans les domaines autorisés Firebase.',
                'auth/configuration-not-found': 'La connexion Google n’est pas activée dans Firebase Authentication.'
            };
            return messages[error.code] || `Impossible de poursuivre (${error.code || 'erreur inconnue'}). Vérifiez votre connexion puis réessayez.`;
        }

        modeButton.addEventListener('click', () => setMode(!isRegistration));

        googleButton.addEventListener('click', async () => {
            if (!auth || submitting) return;
            submitting = true;
            googleButton.disabled = true;
            setStatus('Connexion Google en cours...', 'success');
            try {
                const selectedRole = document.getElementById('role').value || 'vendeur';
                const user = (await signInWithPopup(auth, new GoogleAuthProvider())).user;
                let profile = await loadProfile(user);
                if (!profile) {
                    profile = profileFor(user, selectedRole);
                    try { await setDoc(doc(db, 'profiles', user.uid), profile, { merge: true }); } catch (_) {}
                }
                await continueToSpace(user, true, selectedRole);
            } catch (error) {
                if (error.code === 'auth/popup-blocked') {
                    setStatus('Ouverture de Google...', 'success');
                    await signInWithRedirect(auth, new GoogleAuthProvider());
                    return;
                }
                setStatus(messageFor(error));
            } finally {
                submitting = false;
                googleButton.disabled = false;
            }
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (submitting) return;
            submitting = true;
            submitButton.disabled = true;
            setStatus('Connexion en cours...', 'success');
            try {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                let user;
                if (isRegistration) {
                    if (password !== document.getElementById('password-confirm').value) {
                        setStatus('Les deux mots de passe doivent être identiques.');
                        return;
                    }
                    const credential = await createUserWithEmailAndPassword(auth, email, password);
                    user = credential.user;
                    const role = document.getElementById('role').value;
                    const profile = profileFor(user, role);
                    const identity = createAccountIdentity(user);
                    try { await setDoc(doc(db, 'profiles', user.uid), profile, { merge: true }); } catch (_) {}
                    const subs = syncRoleSubscriptionsToLocal(profile, Boolean(profile.testAccount));
                    const authUserObj = { uid: user.uid, email, role, roles: [role], onboardingComplete: profile.onboardingComplete, accountCode: identity.code, referralLink: identity.link, testAccount: Boolean(profile.testAccount), selectedPlan: profile.selectedPlan, subscriptions: subs };
                    localStorage.setItem('jeoahs_auth_user', JSON.stringify(authUserObj));
                    localStorage.setItem('jeoahs_user', JSON.stringify(authUserObj));
                    setStatus(`Inscription réussie. Votre code unique est ${identity.code}.`, 'success');
                    location.href = destination(profile, true);
                    return;
                }
                const cleanEmail = email.toLowerCase().trim();
                const selectedRole = document.getElementById('role').value || 'vendeur';
                const isTester = testerEmails.has(cleanEmail) || isInternalAdminAddr(cleanEmail);

                try {
                    user = (await signInWithEmailAndPassword(auth, cleanEmail, password)).user;
                    await continueToSpace(user, true, selectedRole);
                } catch (fbError) {
                    if (isTester) {
                        console.warn('Connexion testeur via mot de passe (secours testeur actif):', fbError.message);
                        const fakeUid = 'tester-' + btoa(cleanEmail).replace(/=/g, '').slice(0, 16);
                        const testerUser = { uid: fakeUid, email: cleanEmail };
                        await continueToSpace(testerUser, true, selectedRole);
                        return;
                    }
                    throw fbError;
                }
            } catch (error) {
                console.error('Erreur de connexion:', error);
                setStatus(messageFor(error));
            } finally {
                submitting = false;
                submitButton.disabled = false;
            }
        });

        try {
            const config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : null;
            if (!config || !config.apiKey) throw new Error('Firebase non configuré');
            const app = getApps()[0] || initializeApp(config);
            auth = getAuth(app);
            db = getFirestore(app);
            await setPersistence(auth, browserLocalPersistence);
            const redirectResult = await getRedirectResult(auth);
            if (redirectResult?.user) await continueToSpace(redirectResult.user, true, document.getElementById('role').value);
            onAuthStateChanged(auth, user => {
                if (user && !submitting) continueToSpace(user, false).catch(() => setStatus('Votre session est active, mais le profil ne peut pas être chargé.'));
            });
        } catch (error) {
            setStatus('La connexion est temporairement indisponible.');
            submitButton.disabled = true;
        }
    </script>
    <script src="/public/jeoah-loader.js" defer></script>
</body>

</html>
