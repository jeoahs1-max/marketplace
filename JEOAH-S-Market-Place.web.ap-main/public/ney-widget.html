<div id="ney-widget-proxy"></div>
<script>
(function () {
  const proxy = document.getElementById('ney-widget-proxy');
  if (!proxy) return;
  fetch('/ney-widget.html')
    .then(response => {
      if (!response.ok) throw new Error('Widget Ney indisponible');
      return response.text();
    })
    .then(html => {
      proxy.innerHTML = html;
      proxy.querySelectorAll('script').forEach(script => {
        const executable = document.createElement('script');
        executable.textContent = script.textContent;
        document.body.appendChild(executable);
      });
    })
    .catch(error => console.warn(error.message));
})();
</script>
