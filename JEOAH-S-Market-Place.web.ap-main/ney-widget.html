<div id="ney-widget" style="position:fixed;right:20px;bottom:20px;z-index:9999;font-family:Arial,sans-serif">
  <div id="ney-panel" hidden
    style="width:min(360px,calc(100vw - 40px));height:420px;background:#fff;border:1px solid #d7e2e8;border-radius:16px;box-shadow:0 12px 35px #102a4340;overflow:hidden">
    <div style="padding:16px;background:#102a43;color:#fff;font-weight:700;display:flex;justify-content:space-between">
      Ney, assistant JEOAH'S <button id="ney-close"
        style="border:0;background:transparent;color:#fff;font-size:20px">×</button></div>
    <div id="ney-messages" style="height:295px;padding:14px;overflow:auto;background:#f5f8fa">
      <p><strong>Ney :</strong> Bonjour. Je peux vous aider avec les rôles, la vitrine, les plans et la livraison.</p>
    </div>
    <form id="ney-form" style="display:flex;gap:8px;padding:12px;border-top:1px solid #d7e2e8"><input id="ney-input"
        required placeholder="Écrivez votre question"
        style="min-width:0;flex:1;padding:10px;border:1px solid #c9d6df;border-radius:8px"><button
        style="border:0;border-radius:8px;padding:10px 14px;background:#1665d8;color:#fff;font-weight:700">Envoyer</button>
    </form>
  </div><button id="ney-open" aria-label="Ouvrir Ney"
    style="width:58px;height:58px;border:0;border-radius:50%;background:#1665d8;color:#fff;font-size:22px;box-shadow:0 8px 20px #102a4340">✦</button>
</div>
<script>(function () { const panel = document.getElementById('ney-panel'), open = document.getElementById('ney-open'), close = document.getElementById('ney-close'), form = document.getElementById('ney-form'), input = document.getElementById('ney-input'), messages = document.getElementById('ney-messages'); const answer = (text) => { const q = text.toLowerCase(); if (q.includes('plan') || q.includes('abonnement')) return 'Les plans sont en préparation. Aucun paiement réel n’est actif.'; if (q.includes('livraison') || q.includes('retour')) return 'Le vendeur indique les zones, délais, retours et remboursements. Consultez la politique Livraison.'; if (q.includes('affili')) return 'Un affilié ajoute ses programmes partenaires puis ses produits dans sa vitrine.'; if (q.includes('vendeur')) return 'Un vendeur présente ses produits et reste responsable de la livraison.'; return 'Je peux expliquer les parcours vendeur, affilié, acheteur, les plans et la livraison.' }; open.onclick = () => { panel.hidden = false; open.hidden = true }; close.onclick = () => { panel.hidden = true; open.hidden = false }; form.onsubmit = (e) => { e.preventDefault(); const text = input.value.trim(); messages.insertAdjacentHTML('beforeend', '<p><strong>Vous :</strong> ' + text.replace(/[&<>]/g, '') + '</p><p><strong>Ney :</strong> ' + answer(text) + '</p>'); input.value = ''; messages.scrollTop = messages.scrollHeight }; })();</script>
