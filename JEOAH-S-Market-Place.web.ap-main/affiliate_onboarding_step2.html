<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affilié - Étape 2 : Réseaux Sociaux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        let db, auth, userId;
        let socialLinks = {};

        const SOCIAL_PLATFORMS = [
            { id: 'tiktok', name: 'TikTok', icon_svg: `https://www.vectorlogo.zone/logos/tiktok/tiktok-icon.svg`, placeholder: 'Lien de votre profil TikTok', required: true },
            { id: 'youtube', name: 'YouTube', icon_svg: `https://www.vectorlogo.zone/logos/youtube/youtube-icon.svg`, placeholder: 'Lien de votre chaîne YouTube', required: true },
            { id: 'instagram', name: 'Instagram', icon_svg: `https://www.vectorlogo.zone/logos/instagram/instagram-icon.svg`, placeholder: 'Lien de votre profil Instagram', required: true },
            { id: 'twitter', name: 'X / Twitter', icon_svg: `https://www.vectorlogo.zone/logos/twitter/twitter-icon.svg`, placeholder: 'Lien de votre profil X (Twitter)', required: false },
            { id: 'twitch', name: 'Twitch', icon_svg: `https://www.vectorlogo.zone/logos/twitch/twitch-icon.svg`, placeholder: 'Lien de votre chaîne Twitch', required: false },
            { id: 'reddit', name: 'Reddit', icon_svg: `https://www.vectorlogo.zone/logos/reddit/reddit-icon.svg`, placeholder: 'Lien de votre profil Reddit', required: false },
            { id: 'quora', name: 'Quora', icon_svg: `https://www.vectorlogo.zone/logos/quora/quora-icon.svg`, placeholder: 'Lien de votre profil Quora', required: false }, 
            { id: 'telegram', name: 'Telegram', icon_svg: `https://www.vectorlogo.zone/logos/telegram/telegram-icon.svg`, placeholder: 'Lien de votre canal/profil Telegram', required: false },
            { id: 'snapchat', name: 'Snapchat', icon_svg: `https://www.vectorlogo.zone/logos/snapchat/snapchat-icon.svg`, placeholder: 'Lien de votre profil Snapchat', required: false },
            { id: 'facebook', name: 'Facebook', icon_svg: `https://www.vectorlogo.zone/logos/facebook/facebook-icon.svg`, placeholder: 'Lien de votre page/profil Facebook', required: false }, 
        ];
        
        document.addEventListener('DOMContentLoaded', () => {
            const account = JSON.parse(localStorage.getItem('jeoahs_auth_user') || 'null');
            if (!account) {
                window.location.href = '/public/auth.html';
                return;
            }
            if (account.role === 'affilie' && account.onboardingComplete) {
                window.location.href = '/affiliate-storefront.html';
                return;
            }
            socialLinks = JSON.parse(localStorage.getItem('jeoahs_social_links') || '{}');
            renderSocialLinks();
            document.getElementById('loading-indicator').classList.add('hidden');
            document.getElementById('onboarding-content').classList.remove('hidden');
        });

        window.handleInputChange = function(platformId, value) {
            socialLinks[platformId] = value.trim();
        };

        function renderSocialLinks() {
            const container = document.getElementById('social-links-container');
            container.innerHTML = '';
            const requiredPlatforms = SOCIAL_PLATFORMS.filter(p => p.required);
            const optionalPlatforms = SOCIAL_PLATFORMS.filter(p => !p.required);

            requiredPlatforms.forEach(platform => {
                container.innerHTML += createSocialLinkHtml(platform, socialLinks[platform.id] || "");
            });

            container.innerHTML += `<div class="pt-6 pb-2 text-lg font-bold text-gray-800 border-t border-gray-200 mt-6">Autres Réseaux (Optionnels)</div>`;
            
            optionalPlatforms.forEach(platform => {
                container.innerHTML += createSocialLinkHtml(platform, socialLinks[platform.id] || "");
            });
        }
        
        function createSocialLinkHtml(platform, currentValue) {
            const isRequired = platform.required;
            return `
                <div class="p-5 rounded-2xl border border-gray-200 bg-white shadow-lg transition hover:shadow-xl flex items-center space-x-4">
                    <div class="flex-shrink-0">
                        <img src="${platform.icon_svg}" alt="Logo ${platform.name}" class="w-10 h-10 object-contain"/>
                    </div>
                    <div class="flex-grow">
                        <label for="input-${platform.id}" class="block text-sm font-semibold text-gray-800">${platform.name} ${isRequired ? '(*)' : ''}</label>
                        <input type="url" id="input-${platform.id}" value="${currentValue}" oninput="handleInputChange('${platform.id}', this.value)" placeholder="${platform.placeholder}" class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-600 focus:border-blue-600 text-base shadow-sm">
                    </div>
                </div>
            `;
        }

        window.handleSubmit = function(event) {
            event.preventDefault();
            const missing = SOCIAL_PLATFORMS.filter(platform => platform.required && !socialLinks[platform.id]);
            if (missing.length) {
                showMessage('Profils manquants', `Ajoutez un lien pour : ${missing.map(platform => platform.name).join(', ')}.`);
                return;
            }
            const invalid = Object.values(socialLinks).some(value => value && !/^https?:\/\//i.test(value));
            if (invalid) {
                showMessage('Lien invalide', 'Chaque lien doit commencer par http:// ou https://.');
                return;
            }
            localStorage.setItem('jeoahs_social_links', JSON.stringify(socialLinks));
            window.location.href = 'affiliate_onboarding_step3.html';
        };

        function showMessage(title, message) {
            document.getElementById('message-title').textContent = title;
            document.getElementById('message-text').textContent = message;
            document.getElementById('message-modal').classList.remove('hidden');
        }

    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f8fc; }
        .border-red-500 { border-color: #ef4444 !important; }
    </style>
</head>
<body>
    <div id="loading-indicator" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <p class="text-gray-600 text-lg">Préparation de votre profil...</p>
    </div>

    <main id="onboarding-content" class="hidden min-h-screen p-4 sm:p-8">
        <div class="max-w-4xl mx-auto">
            <header class="mb-8">
                <p class="text-sm font-bold uppercase tracking-wide text-blue-700" data-i18n="stepTwo">Étape 2 sur 3</p>
                <h1 class="mt-2 text-3xl sm:text-4xl font-extrabold text-gray-900" data-i18n="socialTitle">Présentez vos réseaux sociaux</h1>
                <p class="mt-3 max-w-2xl text-gray-600" data-i18n="socialText">Ces profils seront visibles sur votre vitrine afin que les visiteurs puissent découvrir votre contenu.</p>
            </header>

            <form onsubmit="handleSubmit(event)" class="space-y-4">
                <div id="social-links-container" class="space-y-4"></div>
                <div class="flex justify-between pt-4">
                    <a href="affiliate_onboarding_step1.html" class="px-5 py-3 text-gray-700 font-bold rounded-xl border border-gray-300 hover:bg-gray-50" data-i18n="back">Retour</a>
                    <button type="submit" class="px-6 py-3 bg-blue-700 text-white font-bold rounded-xl hover:bg-blue-800" data-i18n="saveContinue">Enregistrer et continuer</button>
                </div>
            </form>
        </div>
    </main>

    <div id="message-modal" class="hidden fixed inset-0 bg-gray-900/70 items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h2 id="message-title" class="text-xl font-bold text-gray-900"></h2>
            <p id="message-text" class="mt-3 text-gray-600"></p>
            <button type="button" onclick="document.getElementById('message-modal').classList.add('hidden')" class="mt-6 w-full py-3 bg-blue-700 text-white font-bold rounded-xl">Compris</button>
        </div>
    </div>

    <div id="ney-widget-container"></div>
    <script src="/public/assets/js/page-language.js"></script>
    <script>
        fetch('/jeoah-widget.html').then(r => r.text()).then(html => {
            const container = document.getElementById('ney-widget-container');
            if (container) {
                container.innerHTML = html;
                container.querySelectorAll('script').forEach(s => {
                    const n = document.createElement('script');
                    n.textContent = s.textContent;
                    document.body.appendChild(n);
                });
            }
        });
    </script>
</body>
</html>
